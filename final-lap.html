<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Final Lap · ISTEDA × EL FORSA</title>
<style>
:root{--ink:#10130f;--lime:#d8ff36;--paper:#f2f1e9;--rule:#c8c9bf;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--paper);font:17px/1.55 Arial,Helvetica,sans-serif}
.frame{width:min(1200px,calc(100% - 48px));margin:auto}
header{border-bottom:1px solid #41473b}nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px}
.brand{display:flex;align-items:center;gap:16px}.brand img{width:160px;height:60px;object-fit:contain}.brand img+img{width:118px}
a{color:inherit}nav a{font-size:.9rem;font-weight:bold;text-underline-offset:4px}
.hero{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);align-items:center;gap:clamp(24px,5vw,80px);padding-block:clamp(32px,5vw,70px)}
h1,h2,h3,p,figure{margin:0}.tag,.date,label,.crew figcaption{font-weight:750}.tag{color:var(--lime);font-size:.78rem;letter-spacing:.12em}
h1,h2,h3{font-family:'Archivo Black','Arial Black',Arial,sans-serif;font-weight:900}
h1{font-size:clamp(76px,10vw,154px);line-height:.81;text-transform:uppercase;letter-spacing:-.075em;margin:24px 0 28px}
h1 em{color:var(--lime);display:block}.date{color:var(--lime);margin:0 0 12px}.intro{max-width:48ch;font-size:clamp(18px,1.6vw,23px)}
.crew{position:relative;overflow:hidden;border-radius:6px}.crew img{width:100%;height:clamp(420px,40vw,570px);object-fit:cover;display:block}.crew figcaption{position:absolute;bottom:12px;left:12px;background:var(--ink);padding:5px 10px;font-size:.75rem;color:var(--paper)}
form{max-width:410px;margin-top:24px}label,input,button{display:block}label{font-size:.87rem;margin-bottom:6px}input,button{font:inherit}input{width:100%;color:var(--paper);background:#22271d;border:1px solid #78846b;border-radius:6px;padding:12px}button{margin-top:12px;border:0;border-radius:40px;background:var(--lime);color:var(--ink);font-weight:800;padding:12px 22px;cursor:pointer}
:focus-visible{outline:3px solid #72b8ff;outline-offset:3px}#status:not(:empty){margin-top:12px}

document.querySelector('#gate').addEventListener('submit',async event=>{
  event.preventDefault();
  const button=event.currentTarget.querySelector('button');
  button.disabled=true;
  try {
    const draft = document.createElement('template');
    draft.innerHTML = await unlock(document.querySelector('#password').value);
    const plan = draft.content;
    const hero = document.querySelector('#hero').content.cloneNode(true);
    const copy = hero.querySelector('.copy');
    copy.querySelector('.tag').textContent = plan.querySelector('.tag').textContent;
    const description = plan.querySelector('.date + p');
    description.className = 'intro';
    copy.append(plan.querySelector('.date'), description);
    const [timelineHeading, packingHeading] = plan.querySelectorAll('h2');
    const packingNotes = [packingHeading.nextElementSibling, packingHeading.nextElementSibling.nextElementSibling];
    const booking = plan.querySelector('.booking');
    const entry = document.createElement('span');
    entry.className = 'entry-note';
    entry.textContent = 'Free to join';
    booking.querySelector('h2').before(entry);
    function section(className, ...children) {
      const block = document.createElement('section');
      block.className = className;
      const inner = document.createElement('div');
      inner.className = 'frame';
      inner.append(...children);
      block.append(inner);
      return block;
    }
    document.querySelector('#content').replaceChildren(hero, plan.querySelector('.crew-afternoon'), plan.querySelector('.village'), section('schedule', timelineHeading, plan.querySelector('ol')), section('packing', packingHeading, ...packingNotes), booking);
    const heading=document.querySelector('h1'); heading.tabIndex=-1; heading.focus();
  } catch {
    document.querySelector('#status').textContent='Couldn’t unlock the plan. Check your password and try again.';
    button.disabled=false;
  }
});
