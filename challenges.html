<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Challenges | RUN ALONG.</title><style>
:root{color-scheme:dark;--lime:#d8ff36;--ink:#11120f;--panel:#20231d;--text:#f3f3ec}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:1rem/1.5 system-ui,sans-serif}
main{max-width:760px;margin:auto;padding:28px 20px 64px}a{color:var(--lime)}h1{font-size:clamp(2.5rem,9vw,5rem);line-height:1;margin:.35em 0;letter-spacing:-.07em}h2,h3,p{margin-top:0}
section,article{background:var(--panel);border:1px solid #43483d;border-radius:14px;padding:20px;margin:16px 0}
button{background:var(--lime);color:var(--ink);border:0;border-radius:8px;padding:12px 16px;font:inherit;font-weight:750;cursor:pointer}
button:disabled{opacity:.5;cursor:default}label{display:block;margin:12px 0}input{display:block;max-width:100%;margin:6px 0;background:var(--ink);color:inherit;border:1px solid #686e60;padding:10px;border-radius:6px;font:inherit}
nav{display:flex;gap:8px;flex-wrap:wrap}nav button[aria-pressed="false"]{background:var(--panel);color:var(--text);border:1px solid #686e60}
small,.muted{color:#c2c7bb}output{display:block;margin:10px 0}output:empty{display:none}
</style><script type="module" src="challenges.js"></script></head>
<body><main><a href="./">← RUN ALONG.</a><h1>Challenges<span style="color:var(--lime)">.</span></h1>
<p>ISTEDA × EL FORSA · Dubai Run</p>
<p>Save the PDF before the run. Take your photos offline and upload them when you’re back online.</p>
<button id="download" type="button" disabled>Download Challenge PDF</button>
<p id="catalog-status" role="status"></p>
<section id="entry"><h2>Verify your entry</h2><form id="verify">
<label>Registered WhatsApp number<input name="phone" type="tel" autocomplete="tel" placeholder="05X XXX XXXX" required></label>
<label>Photo wearing your ISTEDA RUN ALONG armband<input name="pass" type="file" accept="image/*" required></label>
<p class="muted">The organizing team reviews your armband and task photos privately.</p>
<button id="continue" disabled>Continue to Challenges</button><output id="entry-status" role="status"></output></form></section>
<div id="play" hidden><nav id="levels" aria-label="Challenge levels"></nav><section id="tasks" aria-label="Tasks"></section></div>
</main></body></html>
